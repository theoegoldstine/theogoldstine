<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quotes — Theo Goldstine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a0a;
      color: #e0e0e0;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 400;
      min-height: 100vh;
    }

    /* CRT scanline overlay */
    .scanlines {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 100;
      pointer-events: none;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0, 0, 0, 0.08) 2px,
        rgba(0, 0, 0, 0.08) 4px
      );
    }

    .vignette {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 99;
      pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 50%, rgba(0, 0, 0, 0.8) 100%);
    }

    .header {
      position: fixed;
      top: 0; left: 0; width: 100%;
      z-index: 10;
      padding: 1.2rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(10, 10, 10, 0.9);
      backdrop-filter: blur(10px);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }

    .header .prompt {
      color: #888;
      font-size: 0.75rem;
    }

    .header h1 {
      font-weight: 500;
      font-size: 0.8rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #e0e0e0;
    }

    .header a {
      font-size: 0.7rem;
      font-weight: 400;
      color: #e0e0e0;
      text-decoration: none;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 0.3rem 0.8rem;
      transition: all 0.2s;
    }

    .header a:hover {
      color: #fff;
      border-color: #fff;
      background: rgba(255, 255, 255, 0.1);
      text-shadow: 0 0 8px rgba(255, 255, 255, 0.4);
    }

    .container {
      padding: 6rem 2rem 4rem;
      max-width: 780px;
      margin: 0 auto;
    }

    .quote-block {
      border-left: 1px solid rgba(255, 255, 255, 0.15);
      padding: 1.2rem 0 1.2rem 1.8rem;
      margin-bottom: 2.8rem;
      position: relative;
      transition: border-color 0.3s;
    }

    .quote-block:hover {
      border-left-color: rgba(255, 255, 255, 0.6);
    }

    .quote-block::before {
      content: '"';
      position: absolute;
      left: -0.05rem;
      top: 1rem;
      font-size: 1.4rem;
      color: rgba(255, 255, 255, 0.15);
      line-height: 1;
    }

    .quote-text {
      font-size: 0.85rem;
      line-height: 1.8;
      color: #d0d0d0;
      font-weight: 300;
      font-style: italic;
    }

    .quote-attribution {
      margin-top: 0.9rem;
      font-size: 0.65rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #666;
    }

    .quote-attribution .author {
      color: #999;
    }

    .quote-attribution .source {
      color: #555;
    }

    @media (max-width: 600px) {
      .header { padding: 1rem; }
      .container {
        padding: 5rem 1.2rem 3rem;
      }
      .quote-text { font-size: 0.8rem; }
    }
  </style>
</head>
<body>

<div class="scanlines"></div>
<div class="vignette"></div>

<div class="header">
  <div class="header-left">
    <span class="prompt">theo@quotes:~$</span>
    <h1>quotes.log</h1>
  </div>
  <a href="index.html">[esc] back</a>
</div>

<div class="container" id="container"></div>

<script>
const container = document.getElementById('container');

function parseTxt(raw) {
  return raw
    .split(/\n{2,}/)
    .map(block => block.trim())
    .filter(Boolean)
    .map(block => {
      const lines = block.split('\n').map(l => l.trim()).filter(Boolean);
      if (lines.length < 2) return null;
      const text = lines[0];
      const parts = lines[1].split('|').map(s => s.trim());
      return { text, author: parts[0], source: parts[1] || null };
    })
    .filter(Boolean);
}

function render(quotes) {
  quotes.forEach(q => {
    const block = document.createElement('div');
    block.className = 'quote-block';
    const attribution = q.source
      ? `<span class="author">${q.author}</span> <span class="source">— ${q.source}</span>`
      : `<span class="author">${q.author}</span>`;
    block.innerHTML = `
      <div class="quote-text">${q.text}</div>
      <div class="quote-attribution">${attribution}</div>
    `;
    container.appendChild(block);
  });
}

fetch('quotes.txt')
  .then(r => r.text())
  .then(raw => render(parseTxt(raw)))
  .catch(() => {
    container.innerHTML = '<p style="color:#555;font-size:0.75rem;">no quotes found.</p>';
  });

addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    window.location.href = 'index.html';
  }
});
</script>

</body>
</html>
